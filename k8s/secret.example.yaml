# Template only — do NOT fill in real values here and commit them.
# base64 is encoding, not encryption; a filled-in copy of this file is
# just as sensitive as a plaintext one.
#
# Create the real secret once per cluster with:
#
#   kubectl create secret generic todo-app-secrets -n devops-demo \
#     --from-literal=MONGODB_URI='mongodb+srv://<user>:<password>@<cluster-host>/todo_lists' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GOOGLE_CLIENT_ID='<optional>' \
#     --from-literal=GOOGLE_CLIENT_SECRET='<optional>'
#
# GOOGLE_CLIENT_ID/SECRET are optional — deployment.yaml marks those two
# keys `optional: true`, so the app starts fine without them (Google
# sign-in just won't be offered).
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  namespace: devops-demo
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster-host>/todo_lists"
  SESSION_SECRET: "<random-64-char-hex-string>"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
