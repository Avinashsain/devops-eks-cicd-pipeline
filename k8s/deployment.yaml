apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-todo-app
  namespace: devops-demo
  labels:
    app: devops-todo-app
spec:
  replicas: 3 # 💰 start at 1; HPA scales up only under real load
  selector:
    matchLabels:
      app: devops-todo-app
  template:
    metadata:
      labels:
        app: devops-todo-app
    spec:
      containers:
        - name: devops-todo-app
          image: IMAGE_PLACEHOLDER # replaced by Jenkins at deploy time
          ports:
            - containerPort: 3009
          env:
            - name: PORT
              value: "3009"
            - name: NODE_ENV
              value: "production"
            - name: COOKIE_SECURE
              value: "false" # flip to "true" once the ingress terminates TLS
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: MONGODB_URI #MONGODB URI
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SESSION_SECRET
            - name: GOOGLE_CLIENT_ID #GOOGLE CLIENT ID 
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 10
            periodSeconds: 15
