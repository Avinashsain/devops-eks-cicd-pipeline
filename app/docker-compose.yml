services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-list-api:local
    ports:
      - "3009:3009"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3009
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3009/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
